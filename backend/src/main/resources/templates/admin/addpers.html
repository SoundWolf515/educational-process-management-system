<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar colaborador - CEBE</title>
    <link rel="stylesheet" th:href="@{/css/adminnavstyle.css}">
    <link rel="stylesheet" th:href="@{/css/admincontent.css}">
    <link rel="website icon" type="png" th:href="@{/img/logotipo.png}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div th:replace="~{layouts/dashboardnav :: dashboardnav}"></div>
    <main class="form-centro">
        <h3>Agregar colaborador</h3>

        <form class="form-crud" autocomplete="off" method="post" id="userForm" th:action="@{/admin/useradd}">

            <div class="field">
                <input type="text" id="nombresApellidos" name="nombresApellidos" placeholder=" " autocomplete="off"
                    required>
                <label for="nombre">Nombre</label>
            </div>

            <div class="field">
                <input type="text" id="dni" name="dni" placeholder=" " autocomplete="off" required>
                <label for="dni">DNI</label>
            </div>

            <div class="field">
                <input type="text" id="telefono" name="telefono" placeholder=" " autocomplete="off" required>
                <label for="telefono">Teléfono</label>
            </div>

            <div class="field">
                <input type="email" id="correo" name="correo" placeholder=" " autocomplete="off" required>
                <label for="correo">Correo</label>
            </div>

            <div class="field">
                <input type="text" id="username" name="username" placeholder=" " autocomplete="off" required>
                <label for="user">Usuario</label>
            </div>

            <div class="field">
                <input type="password" id="contrasena" name="contrasena" placeholder=" " autocomplete="new-password"
                    required>
                <label for="password">Contraseña</label>
            </div>

            <div id="errorMessage" style="all: unset; color: red; display: none;">
                <p><i class="fa-solid fa-triangle-exclamation"></i> Por favor, selecciona un rol.</p>
            </div>

            <div class="field full-row">
                <select name="rol" id="rol">
                    <option value="" selected disabled>Selecciona un rol</option>
                    <option value="Director">Director</option>
                    <option value="Docente">Docente</option>
                </select>
                <label>Rol:</label>
            </div>

            <button type="submit" class="full-row">Agregar colaborador</button>
        </form>
    </main>
    <script>
        document.getElementById("userForm").addEventListener("submit", function (event) {
            var rolSelect = document.getElementById("rol");
            var errorMessage = document.getElementById("errorMessage");

            if (rolSelect.value === "") {
                event.preventDefault();

                errorMessage.style.display = "block";
            } else {
                errorMessage.style.display = "none";
            }
        });
    </script>
</body>

</html>

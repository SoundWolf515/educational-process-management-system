<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 6px;
            text-align: center;
        }

        th {
            background-color: #f0f0f0;
        }
    </style>
</head>

<body>
    <h2>Reporte de Notas</h2>

    <p><strong>Nombre del estudiante:</strong>
        <span th:text="${estudiante.nombre + ' ' + estudiante.apellido}"></span>
    </p>

    <table>
        <thead>
            <tr>
                <th>Área</th>
                <th>Semestre 1</th>
                <th>Semestre 2</th>
                <th>Promedio</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="fila : ${filasNotas}">
                <td th:text="${fila.curso.nombre}"></td>
                <td th:text="${fila.notaSem1 != null ? fila.notaSem1 : '-'}"></td>
                <td th:text="${fila.notaSem2 != null ? fila.notaSem2 : '-'}"></td>
                <td th:text="${fila.promedio != null ? fila.promedio : '-'}"></td>
            </tr>
        </tbody>
    </table>
</body>

</html>
